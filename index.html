<!-- Pocket Ledger v2 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Ledger v2</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--bg:#f4f6f8;--fg:#172033;--card:#fff;--muted:#64748b;--line:#e2e8f0;
--bd:#cbd5e1;--btn:#172033;--btnfg:#fff;--pos:#15803d;--neg:#dc2626;
--warn:#f59e0b;--warnt:#b45309;--soft:#e2e8f0;--hl:#fffbeb}
:root[data-theme=dark]{--bg:#0f172a;--fg:#e2e8f0;--card:#1e293b;--muted:#94a3b8;
--line:#334155;--bd:#475569;--btn:#e2e8f0;--btnfg:#0f172a;--pos:#4ade80;
--neg:#f87171;--warn:#fbbf24;--warnt:#fbbf24;--soft:#334155;--hl:#3f3a1d}
body{margin:0;background:var(--bg);color:var(--fg);
font:16px Arial,"Noto Sans Thai",Tahoma,sans-serif}
main{max-width:620px;margin:auto;padding:22px 16px 96px}
h1{margin-bottom:5px}
h1 small{font-size:13px;color:var(--muted);font-weight:normal}
h2{margin:0 0 6px;font-size:19px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);padding:18px;border-radius:16px;
margin:14px 0;box-shadow:0 2px 10px #00000010}
.balance{font-size:30px;font-weight:bold;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount{font-size:20px;font-weight:bold;margin-top:8px}
label{display:block;font-size:14px;margin:12px 0 6px}
input,select,button{width:100%;padding:12px;border-radius:9px;
border:1px solid var(--bd);font-size:16px;background:var(--card);color:var(--fg)}
button{background:var(--btn);color:var(--btnfg);border:0;
font-weight:bold;margin-top:14px;cursor:pointer}
button.secondary{background:var(--soft);color:var(--fg)}
button.danger{background:#dc2626;color:#fff}
.entry{padding:12px 0;border-bottom:1px solid var(--line)}
.entry strong{display:block;margin-bottom:5px;word-break:break-word}
.entry small{color:var(--muted)}
.entry button{width:auto;padding:7px 10px;margin:8px 5px 0 0;
font-size:13px;background:var(--soft);color:var(--fg)}
.entry.editing{background:var(--hl)}
.negative{color:var(--neg)}.positive{color:var(--pos)}
.bar{height:10px;border-radius:5px;background:var(--soft);margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--pos)}
.bar span.warn{background:var(--warn)}
.bar span.over{background:var(--neg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid2 .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{width:auto;margin:0;padding:8px 12px;font-size:14px;background:var(--soft);
color:var(--fg);border-radius:20px;font-weight:normal}
.brow{padding:10px 0;border-bottom:1px solid var(--line)}
.brow label{margin:0 0 6px;font-weight:bold}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
border-bottom:1px solid var(--line)}
.alert{padding:4px 0;font-size:15px}
.alert.over{color:var(--neg)}.alert.warn{color:var(--warnt)}
.mini{display:flex;gap:6px;margin-top:8px}
.mini input{padding:8px}
.mini button{width:auto;margin:0;padding:8px 12px;font-size:14px}
.donut{width:200px;max-width:100%;display:block;margin:6px auto}
.chart{width:100%;max-width:420px;display:block;margin:6px auto}
.lg{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.lg i{width:12px;height:12px;border-radius:3px;flex:none}
.lg span{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
border-top:1px solid var(--line);z-index:5}
nav button{flex:1;margin:0;padding:8px 2px;border-radius:0;background:none;
color:var(--muted);font-size:12px;font-weight:normal;display:flex;
flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--fg);font-weight:bold}
nav .ic{font-size:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:9;
background:#172033;color:#fff;padding:10px 14px;border-radius:10px;
display:flex;gap:12px;align-items:center;max-width:92%;font-size:14px;
box-shadow:0 4px 16px #0004}
#toast button{width:auto;margin:0;padding:4px 10px;font-size:13px;background:#fff;color:#172033}
#lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;
align-items:center;justify-content:center;padding:20px}
.lockbox{width:100%;max-width:320px;text-align:center}
.lockic{font-size:44px}
#pinErr{color:var(--neg);min-height:20px;font-size:14px}
input[type=file]{display:none}
</style>
</head>
<body>
<main>
<h1>Pocket Ledger <small>v2</small></h1>
<p class="muted" data-i="tagline"></p>

<!-- HOME -->
<div class="tab" id="tab-home">
<section class="card">
<div class="muted" data-i="balance"></div>
<div class="balance" id="balance">0.00</div>
</section>

<div class="stats">
<section class="card">
<div class="muted" data-i="income"></div>
<div class="amount positive" id="income">0.00</div>
</section>
<section class="card">
<div class="muted" data-i="expenses"></div>
<div class="amount negative" id="expense">0.00</div>
</section>
</div>

<section class="card">
<div class="muted" data-i="thisMonth"></div>
<div class="amount" id="monthNet">0.00</div>
<div class="muted" id="monthInfo"></div>
<div class="bar"><span id="barFill"></span></div>
<div class="muted" id="barText"></div>
</section>

<section class="card" id="alertsCard" hidden>
<h2 data-i="alerts"></h2>
<div id="alerts"></div>
</section>

<section class="card" id="upcomingCard" hidden>
<h2 data-i="upcoming"></h2>
<div id="upcoming"></div>
</section>

<section class="card" id="formCard">
<h2 id="formTitle"></h2>
<div id="chipWrap" hidden>
<div class="muted" data-i="quickAdd"></div>
<div class="chips" id="chips"></div>
</div>
<form id="form">
<label for="type" data-i="type"></label>
<select id="type">
<option value="expense" data-i="typeExpense"></option>
<option value="income" data-i="typeIncome"></option>
</select>

<label for="category" data-i="category"></label>
<select id="category"></select>

<label for="description" data-i="description"></label>
<input id="description" maxlength="100" data-ph="descPh" required>

<label for="amount"><span data-i="amount"></span> (<span class="cur"></span>)</label>
<input id="amount" type="number" min="0.01"
step="0.01" placeholder="0.00" required>

<label for="date" data-i="date"></label>
<input id="date" type="date" required>

<button type="submit" id="submitBtn"></button>
<button type="button" id="cancel" class="secondary" hidden data-i="cancelEdit"></button>
<button type="button" id="saveTpl" class="secondary" data-i="saveTpl"></button>
</form>
</section>

<section class="card">
<h2 data-i="transactions"></h2>
<input id="q" type="search" data-ph="searchPh">
<div class="grid2">
<select id="fType">
<option value="all" data-i="allTypes"></option>
<option value="income" data-i="typeIncome"></option>
<option value="expense" data-i="typeExpense"></option>
</select>
<select id="fCat"></select>
<input id="fMonth" type="month" class="full" placeholder="YYYY-MM">
</div>
<button type="button" id="clearF" class="secondary" hidden data-i="clearFilters"></button>
<div class="muted" id="resultInfo"></div>
<div id="list"></div>
<button type="button" id="more" class="secondary" hidden data-i="showMore"></button>
</section>
</div>

<!-- BUDGET -->
<div class="tab" id="tab-budget" hidden>
<section class="card">
<h2 data-i="budgets"></h2>
<p class="muted" data-i="budgetHint"></p>
<div id="budgetTotal"></div>
<div id="budgetList"></div>
</section>
<section class="card">
<h2 data-i="goals"></h2>
<div id="goalList"></div>
<form id="goalForm">
<label for="goalName" data-i="goalName"></label>
<input id="goalName" maxlength="60" data-ph="goalNamePh" required>
<label for="goalTarget"><span data-i="goalTarget"></span> (<span class="cur"></span>)</label>
<input id="goalTarget" type="number" min="0.01" step="0.01" required>
<label for="goalDeadline" data-i="goalDeadline"></label>
<input id="goalDeadline" type="date">
<button type="submit" data-i="addGoal"></button>
</form>
</section>
</div>

<!-- PLAN -->
<div class="tab" id="tab-plan" hidden>
<section class="card">
<h2 data-i="recurring"></h2>
<p class="muted" data-i="recHint"></p>
<div id="recList"></div>
<form id="recForm">
<label for="recType" data-i="type"></label>
<select id="recType">
<option value="expense" data-i="typeExpense"></option>
<option value="income" data-i="typeIncome"></option>
</select>
<label for="recCategory" data-i="category"></label>
<select id="recCategory"></select>
<label for="recDesc" data-i="description"></label>
<input id="recDesc" maxlength="100" data-ph="descPh" required>
<label for="recAmount"><span data-i="amount"></span> (<span class="cur"></span>)</label>
<input id="recAmount" type="number" min="0.01" step="0.01" required>
<label for="recDay" data-i="dayOfMonth"></label>
<input id="recDay" type="number" min="1" max="31" step="1" required>
<button type="submit" data-i="addRec"></button>
</form>
</section>
<section class="card">
<h2 data-i="templates"></h2>
<p class="muted" data-i="tplHint"></p>
<div id="tplList"></div>
</section>
</div>

<!-- REPORTS -->
<div class="tab" id="tab-reports" hidden>
<section class="card">
<label for="repMonth" data-i="month"></label>
<input id="repMonth" type="month" placeholder="YYYY-MM">
</section>
<section class="card">
<h2 data-i="summary"></h2>
<div id="repSummary"></div>
</section>
<section class="card">
<h2 data-i="byCategory"></h2>
<div id="donut"></div>
<div id="legend"></div>
</section>
<section class="card">
<h2 data-i="trend"></h2>
<div id="trend"></div>
<div class="lg"><i style="background:var(--pos)"></i><span data-i="income"></span>
<i style="background:var(--neg)"></i><span data-i="expenses"></span></div>
</section>
<section class="card">
<h2 data-i="topExp"></h2>
<div id="topList"></div>
</section>
</div>

<!-- SETTINGS -->
<div class="tab" id="tab-settings" hidden>
<section class="card">
<label for="sTheme" data-i="theme"></label>
<select id="sTheme">
<option value="auto" data-i="themeAuto"></option>
<option value="light" data-i="themeLight"></option>
<option value="dark" data-i="themeDark"></option>
</select>
<label for="sLang" data-i="language"></label>
<select id="sLang">
<option value="en">English</option>
<option value="th">ไทย</option>
</select>
<label for="sCur" data-i="currency"></label>
<select id="sCur">
<option value="₪">₪ ILS</option>
<option value="฿">฿ THB</option>
<option value="$">$ USD</option>
<option value="€">€ EUR</option>
<option value="£">£ GBP</option>
<option value="¥">¥ JPY/CNY</option>
</select>
</section>
<section class="card">
<h2 data-i="security"></h2>
<p class="muted" data-i="pinHint"></p>
<div class="muted" id="pinStatus"></div>
<label for="pinNew" data-i="pinNew"></label>
<input id="pinNew" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
<button type="button" id="setPin" data-i="setPin"></button>
<button type="button" id="lockNow" class="secondary" data-i="lockNow"></button>
<button type="button" id="removePin" class="secondary" data-i="removePin"></button>
</section>
<section class="card">
<h2 data-i="data"></h2>
<button type="button" id="export" data-i="exportCsv"></button>
<button type="button" id="importBtn" class="secondary" data-i="importCsv"></button>
<input type="file" id="importFile" accept=".csv,text/csv">
<button type="button" id="backup" data-i="backup"></button>
<button type="button" id="restoreBtn" class="secondary" data-i="restore"></button>
<input type="file" id="restoreFile" accept=".json,application/json">
<button type="button" id="clearAll" class="danger" data-i="clearAll"></button>
<p class="muted" data-i="storeNote"></p>
</section>
</div>
</main>

<nav>
<button type="button" data-tab="home" class="on"><span class="ic">🏠</span><span data-i="nav_home"></span></button>
<button type="button" data-tab="budget"><span class="ic">🎯</span><span data-i="nav_budget"></span></button>
<button type="button" data-tab="plan"><span class="ic">🔁</span><span data-i="nav_plan"></span></button>
<button type="button" data-tab="reports"><span class="ic">📊</span><span data-i="nav_reports"></span></button>
<button type="button" data-tab="settings"><span class="ic">⚙️</span><span data-i="nav_settings"></span></button>
</nav>

<div id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastBtn" hidden></button></div>

<div id="lock" hidden>
<form id="lockForm" class="lockbox">
<div class="lockic">🔒</div>
<h2 data-i="locked"></h2>
<input id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" data-ph="enterPin">
<p id="pinErr"></p>
<button type="submit" data-i="unlock"></button>
</form>
</div>

<script>
/* ===== Data & helpers ===== */
const $ = id => document.getElementById(id);
const el = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  if (props) Object.assign(e, props);
  e.append(...kids.filter(k => k != null));
  return e;
};
const ITEMS_KEY = "pocket-ledger-v1";
const META_KEY = "pocket-ledger-v2-meta";
const CURRENCIES = ["₪","฿","$","€","£","¥"];

  {id:"food",icon:"🍔",kind:"expense",color:"#f97316"},
  {id:"transport",icon:"🚗",kind:"expense",color:"#3b82f6"},

const catsFor = type => CATS.filter(c => c.kind === type);
const defCat = type => type === "income" ? "extra" : "other";
const normCat = (type, c) => { const k = catOf(c); return k && k.kind === type ? c : defCat(type); };

const defMeta = () => ({budgets:{},goals:[],recurring:[],templates:[],
  settings:{theme:"auto",lang:"en",currency:"₪",pin:""}});
let M = defMeta();
let items = [];
let editingId = null;
let limit = 20;
const F = {q:"",type:"all",cat:"all",month:""};

const t = k => (I18N[M.settings.lang] && I18N[M.settings.lang][k]) || I18N.en[k] || k;
const tf = (k, o) => t(k).replace(/\{(\w+)\}/g, (_, n) => o[n]);
const catName = id => t("cat_" + id);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() :
  Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const round2 = n => Math.round(n * 100) / 100;
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const monthOf = s => s.slice(0, 7);
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const parseYMD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(parseYMD(s)) === s;
const toUTC = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);
const addMonth = (ym, n) => {
  const [y, m] = ym.split("-").map(Number);
  const i = y * 12 + (m - 1) + n;
  return Math.floor(i / 12) + "-" + pad(i % 12 + 1);
};
const locale = () => M.settings.lang === "th" ? "th-TH-u-ca-gregory" : "en-US";
const money = n => M.settings.currency +
  n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const signed = n => (n < 0 ? "−" : "") + money(Math.abs(n));
const sum = (arr, type) => round2(arr.filter(x => x.type === type)
  .reduce((s, x) => s + x.amount, 0));
const inMonth = m => items.filter(x => monthOf(x.date) === m);
const spentByCat = m => {
  const o = {};
  inMonth(m).forEach(x => {
    if (x.type === "expense") o[x.category] = round2((o[x.category] || 0) + x.amount);
  });
  return o;
};

/* ===== Sanitizers (used on load, import and restore) ===== */
function cleanItem(x) {
  if (!x || typeof x !== "object") return null;
  const type = x.type === "income" ? "income" : x.type === "expense" ? "expense" : null;
  const amount = Number(x.amount);
  const description = String(x.description == null ? "" : x.description).trim().slice(0, 200);
  const date = String(x.date == null ? "" : x.date);
  if (!type || !Number.isFinite(amount) || amount <= 0 || !description || !isDate(date)) return null;
  const o = {id: typeof x.id === "string" && x.id ? x.id : uid(), type,
    description, amount: round2(amount), date, category: normCat(type, x.category)};
  if (x.rid) o.rid = String(x.rid);
  return o;
}
function fixIds(arr) {
  const seen = new Set();
  arr.forEach(x => { if (seen.has(x.id)) x.id = uid(); seen.add(x.id); });
  return arr;
}
function cleanMeta(raw) {
  const m = defMeta();
  if (!raw || typeof raw !== "object") return m;
  const cur = today().slice(0, 7);
  const pos = v => { const n = Number(v); return Number.isFinite(n) && n > 0 ? round2(n) : 0; };
  if (raw.budgets && typeof raw.budgets === "object") {
    catsFor("expense").forEach(c => { const v = pos(raw.budgets[c.id]); if (v) m.budgets[c.id] = v; });
  }
  if (Array.isArray(raw.goals)) raw.goals.forEach(g => {
    if (!g || typeof g !== "object") return;
    const name = String(g.name == null ? "" : g.name).trim().slice(0, 60);
    const target = pos(g.target);
    const saved = Math.max(0, Number(g.saved) || 0);
    if (!name || !target) return;
    m.goals.push({id: typeof g.id === "string" && g.id ? g.id : uid(), name, target,
      saved: round2(saved), deadline: isDate(String(g.deadline || "")) ? g.deadline : ""});
  });
  if (Array.isArray(raw.recurring)) raw.recurring.forEach(r => {
    const x = cleanItem(Object.assign({}, r, {date: today()}));
    const day = Math.floor(Number(r && r.day));
    if (!x || !(day >= 1 && day <= 31)) return;
    m.recurring.push({id: typeof r.id === "string" && r.id ? r.id : uid(), type: x.type,
      description: x.description, amount: x.amount, category: x.category, day,
      last: /^\d{4}-\d{2}$/.test(String(r.last)) ? r.last : cur});
  });
  if (Array.isArray(raw.templates)) raw.templates.slice(0, 12).forEach(r => {
    const x = cleanItem(Object.assign({}, r, {date: today()}));
    if (!x) return;
    m.templates.push({id: typeof r.id === "string" && r.id ? r.id : uid(), type: x.type,
      description: x.description, amount: x.amount, category: x.category});
  });
  const s = raw.settings && typeof raw.settings === "object" ? raw.settings : {};
  if (["auto","light","dark"].includes(s.theme)) m.settings.theme = s.theme;
  if (["en","th"].includes(s.lang)) m.settings.lang = s.lang;
  if (CURRENCIES.includes(s.currency)) m.settings.currency = s.currency;
  if (typeof s.pin === "string") m.settings.pin = s.pin.slice(0, 32);
  return m;
}
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(ITEMS_KEY) || "[]");
    if (Array.isArray(raw)) items = fixIds(raw.map(cleanItem).filter(Boolean));
  } catch { items = []; }
  try { M = cleanMeta(JSON.parse(localStorage.getItem(META_KEY) || "null")); }
  catch { M = defMeta(); }
}
function persist() {
  try {
    localStorage.setItem(ITEMS_KEY, JSON.stringify(items));
    localStorage.setItem(META_KEY, JSON.stringify(M));
  } catch { toast(t("saveFail")); }
}

/* ===== Toast ===== */
let toastTimer;
const hideToast = () => { $("toast").hidden = true; };
function toast(msg, label, act) {
  $("toastMsg").textContent = msg;
  const b = $("toastBtn");
  b.hidden = !label;
  if (label) { b.textContent = label; b.onclick = () => { hideToast(); act(); }; }
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, label ? 7000 : 3500);
}

/* ===== Theme / i18n ===== */
const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function applyTheme() {
  const th = M.settings.theme;
  const dark = th === "dark" || (th === "auto" && mq && mq.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
if (mq && mq.addEventListener) mq.addEventListener("change", applyTheme);
function applyI18n() {
  document.documentElement.lang = M.settings.lang;
  document.querySelectorAll("[data-i]").forEach(n => { n.textContent = t(n.dataset.i); });
  document.querySelectorAll("[data-ph]").forEach(n => { n.placeholder = t(n.dataset.ph); });
  document.querySelectorAll(".cur").forEach(n => { n.textContent = M.settings.currency; });
}

/* ===== Category selects ===== */
function fillCats(sel, type, val) {
  sel.replaceChildren();
  catsFor(type).forEach(c => sel.append(el("option", {value: c.id, textContent: c.icon + " " + catName(c.id)})));
  sel.value = catsFor(type).some(c => c.id === val) ? val : defCat(type);
}
function fillFilterCats() {
  const s = $("fCat");
  s.replaceChildren(el("option", {value: "all", textContent: t("allCats")}));
  CATS.forEach(c => s.append(el("option", {value: c.id, textContent: c.icon + " " + catName(c.id)})));
  s.value = F.cat;
}

/* ===== Recurring engine ===== */
function applyRecurring() {
  const td = today(), cur = td.slice(0, 7);
  let added = 0;
  M.recurring.forEach(r => {
    for (let guard = 0; guard < 600; guard++) {
      const m = addMonth(r.last, 1);
      if (m > cur) break;
      const [y, mo] = m.split("-").map(Number);
      const date = m + "-" + pad(Math.min(r.day, daysIn(y, mo)));
      if (date > td) break;
      items.push({id: uid(), type: r.type, description: r.description, amount: r.amount,
        date, category: r.category, rid: r.id});
      r.last = m; added++;
    }
  });
  return added;
}
function nextDue(r) {
  const td = today(), cur = td.slice(0, 7);
  const mk = m => {
    const [y, mo] = m.split("-").map(Number);
    return m + "-" + pad(Math.min(r.day, daysIn(y, mo)));
  };
  let d = mk(cur);
  if (d <= td) d = mk(addMonth(cur, 1));
  return d;
}

/* ===== Bars ===== */
const mkBar = () => el("div", {className: "bar"}, el("span"));
const fillBar = (bar, pct) => {
  const s = bar.firstChild;
  s.style.width = Math.min(Math.max(pct, 0), 100) + "%";
  s.className = pct > 100 ? "over" : pct >= 80 ? "warn" : "";
};

/* ===== Home ===== */
function renderSummary() {
  const inc = sum(items, "income"), exp = sum(items, "expense"), bal = round2(inc - exp);
  $("balance").textContent = signed(bal);
  $("balance").className = "balance" + (bal < 0 ? " negative" : "");
  $("income").textContent = money(inc);
  $("expense").textContent = money(exp);
  const m = inMonth(today().slice(0, 7));
  const mi = sum(m, "income"), me = sum(m, "expense"), net = round2(mi - me);
  $("monthNet").textContent = signed(net);
  $("monthNet").className = "amount " + (net < 0 ? "negative" : "positive");
  $("monthInfo").textContent = m.length + " " + (m.length === 1 ? t("txOne") : t("txMany")) +
    " · " + t("in") + " " + money(mi) + " · " + t("out") + " " + money(me);
  const pct = mi > 0 ? me / mi * 100 : (me > 0 ? 100 : 0);
  fillBar($("barFill").parentNode, pct);
  $("barText").textContent = mi > 0 ? tf("spentPct", {p: Math.round(pct)})
    : me > 0 ? t("noIncomeSpend") : t("noActivity");
}
function renderAlerts() {
  const sp = spentByCat(today().slice(0, 7)), box = $("alerts");
  box.replaceChildren();
  let n = 0;
  catsFor("expense").forEach(c => {
    const b = M.budgets[c.id];
    if (!b) return;
    const s = sp[c.id] || 0, p = s / b * 100;
    if (p < 80) return;
    n++;
    box.append(el("div", {className: "alert " + (p > 100 ? "over" : "warn"),
      textContent: (p > 100 ? "⚠ " : "• ") + c.icon + " " + catName(c.id) + ": " +
        money(s) + " / " + money(b) + " (" + Math.round(p) + "%)"}));
  });
  $("alertsCard").hidden = !n;
}
function renderUpcoming() {
  const td = today(), box = $("upcoming");
  box.replaceChildren();
  const list = M.recurring.map(r => ({r, d: nextDue(r)}))
    .filter(x => dayDiff(td, x.d) <= 14).sort((a, b) => a.d.localeCompare(b.d));
  list.forEach(({r, d}) => {
    const n = dayDiff(td, d), inc = r.type === "income", c = catOf(r.category);
    box.append(el("div", {className: "entry"},
      el("strong", {textContent: (c ? c.icon + " " : "") + r.description}),
      el("small", {textContent: d + " · " + (n === 1 ? t("tomorrow") : tf("inDays", {n}))}),
      el("div", {className: "amount " + (inc ? "positive" : "negative"),
        textContent: (inc ? "+" : "−") + money(r.amount)})));
  });
  $("upcomingCard").hidden = !list.length;
}
function loadForm(x) {
  $("type").value = x.type;
  fillCats($("category"), x.type, x.category);
  $("description").value = x.description;
  $("amount").value = x.amount;
  $("date").value = x.date || today();
}
function setFormMode(mode) {
  $("formTitle").textContent = t(mode === "edit" ? "editTx" : "addTx");
  $("submitBtn").textContent = t(mode === "edit" ? "update" : "save");
  $("cancel").hidden = mode !== "edit";
}
const scrollForm = () => $("formCard").scrollIntoView({behavior: "smooth", block: "start"});
function resetForm() {
  editingId = null;
  $("form").reset();
  fillCats($("category"), "expense");
  $("date").value = today();
  setFormMode("add");
}
function renderChips() {
  const box = $("chips");
  box.replaceChildren();
  M.templates.forEach(tp => {
    const c = catOf(tp.category);
    box.append(el("button", {type: "button", className: "chip",
      textContent: (c ? c.icon + " " : "") + tp.description + " " + money(tp.amount),
      onclick: () => { editingId = null; loadForm(tp); setFormMode("add"); scrollForm(); renderList(); }}));
  });
  $("chipWrap").hidden = !M.templates.length;
}
const sortedItems = () => items.map((x, i) => [x, i])
  .sort((a, b) => b[0].date.localeCompare(a[0].date) || b[1] - a[1]).map(p => p[0]);
const matches = x =>
  (F.type === "all" || x.type === F.type) &&
  (F.cat === "all" || x.category === F.cat) &&
  (!F.month || monthOf(x.date) === F.month) &&
  (!F.q || x.description.toLowerCase().includes(F.q) ||
    catName(x.category).toLowerCase().includes(F.q));
function rowFor(item) {
  const inc = item.type === "income", c = catOf(item.category);
  const row = el("div", {className: "entry" + (item.id === editingId ? " editing" : "")});
  const edit = el("button", {type: "button", textContent: t("edit"), onclick: () => {
    editingId = item.id; loadForm(item); setFormMode("edit"); scrollForm(); renderList();
  }});
  const copy = el("button", {type: "button", textContent: t("copy"), onclick: () => {
    editingId = null; loadForm(Object.assign({}, item, {date: today()}));
    setFormMode("add"); scrollForm(); renderList();
  }});
  const del = el("button", {type: "button", textContent: t("del"), onclick: () => {
    if (!confirm(t("confirmDel"))) return;
    const i = items.findIndex(x => x.id === item.id);
    if (i < 0) return;
    const removed = items.splice(i, 1)[0];
    if (editingId === item.id) resetForm();
    persist(); refresh();
    toast(t("deleted"), t("undo"), () => {
      items.splice(Math.min(i, items.length), 0, removed);
      persist(); refresh();
    });
  }});
  row.append(
    el("strong", {textContent: (c ? c.icon + " " : "") + item.description + (item.rid ? " 🔁" : "")}),
    el("small", {textContent: item.date + " · " + catName(item.category) + " · " +
      (inc ? t("typeIncome") : t("typeExpense"))}),
    el("div", {className: "amount " + (inc ? "positive" : "negative"),
      textContent: (inc ? "+" : "−") + money(item.amount)}),
    edit, copy, del);
  return row;
}
function renderList() {
  const list = $("list");
  list.replaceChildren();
  const active = !!(F.q || F.type !== "all" || F.cat !== "all" || F.month);
  $("clearF").hidden = !active;
  const res = sortedItems().filter(matches);
  $("resultInfo").textContent = active
    ? tf("results", {n: res.length, v: signed(round2(sum(res, "income") - sum(res, "expense")))}) : "";
  if (!items.length) { list.textContent = t("noTx"); $("more").hidden = true; return; }
  if (!res.length) { list.textContent = t("noMatch"); $("more").hidden = true; return; }
  res.slice(0, limit).forEach(x => list.append(rowFor(x)));
  $("more").hidden = res.length <= limit;
}
function renderHome() {
  renderSummary(); renderAlerts(); renderUpcoming(); renderChips();
  fillCats($("category"), $("type").value, $("category").value);
  setFormMode(editingId ? "edit" : "add");
  renderList();
}

    el("strong", {textContent: money(spent) + " / " + money(total) + " (" + Math.round(pct) + "%)"})), bar);
}
function renderBudget() {
  const box = $("budgetList"), month = today().slice(0, 7);
  box.replaceChildren();
  catsFor("expense").forEach(c => {
    const inp = el("input", {type: "number", min: "0", step: "0.01", placeholder: "0",

    inp.setAttribute("aria-label", catName(c.id));
    const info = el("div", {className: "muted"}), bar = mkBar();
    const paint = () => {
      const b = M.budgets[c.id] || 0, s = spentByCat(month)[c.id] || 0, pct = b > 0 ? s / b * 100 : 0;
      fillBar(bar, pct);
      bar.hidden = !(b > 0);
      info.textContent = b > 0
        ? t("spent") + " " + money(s) + " " + t("of") + " " + money(b) + " (" + Math.round(pct) + "%)"
        : t("spent") + " " + money(s);
    };
    inp.onchange = () => {
      const v = Number(inp.value);
      if (inp.value === "" || !(v > 0)) { delete M.budgets[c.id]; inp.value = ""; }
      else M.budgets[c.id] = round2(v);
      persist(); paint(); renderBudgetTotal(); renderAlerts();
    };
    box.append(el("div", {className: "brow"},
      el("label", {textContent: c.icon + " " + catName(c.id)}), inp, bar, info));
    paint();
  });
  renderBudgetTotal();
}
function renderGoals() {
  const box = $("goalList");
  box.replaceChildren();
  if (!M.goals.length) { box.append(el("p", {className: "muted", textContent: t("noGoals")})); return; }
  const td = today();
  M.goals.forEach(g => {
    const pct = g.saved / g.target * 100, bar = mkBar();
    fillBar(bar, pct);
    bar.firstChild.className = pct >= 100 ? "" : "warn";
    const row = el("div", {className: "brow"},
      el("label", {textContent: "🎯 " + g.name}),
      el("div", {className: "muted", textContent: t("goalSaved") + " " + money(g.saved) + " " +
        t("of") + " " + money(g.target) + " (" + Math.floor(pct) + "%)"}), bar);
    if (g.saved >= g.target) {
      row.append(el("div", {className: "positive", textContent: t("goalDone")}));
    } else if (g.deadline) {
      const n = dayDiff(td, g.deadline);
      if (n < 0) row.append(el("div", {className: "negative", textContent: tf("goalOverdue", {d: g.deadline})}));
      else {
        row.append(el("div", {className: "muted", textContent: tf("goalDeadlineInfo", {d: g.deadline, n})}));
        const months = Math.max(1, Math.ceil(n / 30));
        row.append(el("div", {className: "muted",
          textContent: tf("goalPerMonth", {v: money(round2((g.target - g.saved) / months))})}));
      }
    }
    const inp = el("input", {type: "number", min: "0.01", step: "0.01", placeholder: t("amount")});
    const change = sign => () => {
      const v = Number(inp.value);
      if (!(v > 0)) return;
      g.saved = Math.max(0, round2(g.saved + sign * v));
      persist(); renderGoals();
    };
    const dl = el("button", {type: "button", className: "secondary", textContent: t("del"), onclick: () => {
      if (!confirm(t("confirmGoalDel"))) return;
      M.goals = M.goals.filter(x => x.id !== g.id);
      persist(); renderGoals();
    }});
    row.append(el("div", {className: "mini"}, inp,
      el("button", {type: "button", textContent: t("add"), onclick: change(1)}),
      el("button", {type: "button", className: "secondary", textContent: t("withdraw"), onclick: change(-1)}), dl));
    box.append(row);
  });
}

/* ===== Reports ===== */
const NS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs, ...kids) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  e.append(...kids);
  return e;
};
function renderDonut(by, total) {
  const box = $("donut"), lg = $("legend");
  box.replaceChildren(); lg.replaceChildren();
  const entries = Object.entries(by).sort((a, b) => b[1] - a[1]);
  if (!entries.length) { box.textContent = t("noExpMonth"); return; }
  const R = 40, C = 2 * Math.PI * R;
  let off = 0;
  const s = svg("svg", {viewBox: "0 0 120 120", class: "donut", role: "img", "aria-label": t("byCategory")});
  const track = svg("circle", {cx: 60, cy: 60, r: R, fill: "none", "stroke-width": 18});
  track.style.stroke = "var(--soft)";
  s.append(track);
  entries.forEach(([id, v]) => {
    const len = v / total * C;
    const c = svg("circle", {cx: 60, cy: 60, r: R, fill: "none", "stroke-width": 18,
      stroke: catOf(id).color, "stroke-dasharray": len + " " + (C - len),
      "stroke-dashoffset": -off, transform: "rotate(-90 60 60)"}, svg("title", {}, catName(id) + ": " + money(v)));
    s.append(c);
    off += len;
  });
  const tx = svg("text", {x: 60, y: 64, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"});
  tx.textContent = M.settings.currency +
    new Intl.NumberFormat("en-US", {notation: "compact", maximumFractionDigits: 1}).format(total);
  tx.style.fill = "var(--fg)";
  s.append(tx);
  box.append(s);
  entries.forEach(([id, v]) => {
    const i = el("i"); i.style.background = catOf(id).color;
    lg.append(el("div", {className: "lg"}, i,
      el("span", {textContent: catOf(id).icon + " " + catName(id)}),
      el("strong", {textContent: money(v) + " · " + Math.round(v / total * 100) + "%"})));
  });
}
function renderTrend(m) {
  const box = $("trend");
  box.replaceChildren();
  const data = [];
  for (let i = 5; i >= 0; i--) {
    const k = addMonth(m, -i), a = inMonth(k);
    data.push({k, inc: sum(a, "income"), exp: sum(a, "expense")});
  }
  const max = Math.max(1, ...data.flatMap(d => [d.inc, d.exp]));
  const base = 125, top = 10, bw = 16;
  const s = svg("svg", {viewBox: "0 0 300 150", class: "chart", role: "img", "aria-label": t("trend")});
  const axis = svg("line", {x1: 6, x2: 294, y1: base, y2: base, "stroke-width": 1});
  axis.style.stroke = "var(--bd)";
  s.append(axis);
  data.forEach((d, i) => {
    const x = 14 + i * 47;
    [[d.inc, "var(--pos)", x], [d.exp, "var(--neg)", x + bw + 2]].forEach(([v, color, bx]) => {
      const h = v / max * (base - top);
      const r = svg("rect", {x: bx, y: base - h, width: bw, height: v > 0 ? Math.max(h, 1) : 0, rx: 2},
        svg("title", {}, money(v)));
      r.style.fill = color;
      s.append(r);
    });
    const [y, mo] = d.k.split("-").map(Number);
    const lab = svg("text", {x: x + bw + 1, y: 142, "text-anchor": "middle", "font-size": 9});
    lab.textContent = new Date(y, mo - 1, 1).toLocaleDateString(locale(), {month: "short"});
    lab.style.fill = "var(--muted)";
    s.append(lab);
  });
  box.append(s);
}
function renderReports() {
  const cur = today().slice(0, 7);
  let m = $("repMonth").value;
  if (!/^\d{4}-\d{2}$/.test(m)) { m = cur; $("repMonth").value = cur; }
  const [y, mo] = m.split("-").map(Number);
  const a = inMonth(m), p = inMonth(addMonth(m, -1));
  const inc = sum(a, "income"), exp = sum(a, "expense"), net = round2(inc - exp), pe = sum(p, "expense");
  const box = $("repSummary");
  box.replaceChildren();
  const kv = (label, val, cls) => box.append(el("div", {className: "kv"},
    el("span", {textContent: label}), el("strong", {textContent: val, className: cls || ""})));
  kv(t("income"), money(inc), "positive");
  kv(t("expenses"), money(exp), "negative");
  kv(t("net"), signed(net), net < 0 ? "negative" : "positive");
  if (inc > 0) kv(t("savingsRate"), Math.round(net / inc * 100) + "%", net < 0 ? "negative" : "positive");
  let vs = "—", vc = "";
  if (pe > 0) {
    const pc = (exp - pe) / pe * 100;
    vs = (pc > 0 ? "▲ " : pc < 0 ? "▼ " : "= ") + Math.abs(Math.round(pc)) + "% (" + signed(round2(exp - pe)) + ")";
    vc = pc > 0 ? "negative" : pc < 0 ? "positive" : "";
  }
  kv(t("vsLast"), vs, vc);
  const dim = daysIn(y, mo), dn = m === cur ? Number(today().slice(8)) : dim;
  kv(t("dailyAvg"), money(round2(exp / dn)));
  if (m === cur) kv(t("forecast"), money(round2(exp / dn * dim)));
  renderDonut(spentByCat(m), exp);
  renderTrend(m);
  const tl = $("topList");
  tl.replaceChildren();
  const top = a.filter(x => x.type === "expense").sort((x, z) => z.amount - x.amount).slice(0, 5);
  if (!top.length) tl.textContent = t("noExpMonth");
  top.forEach(x => tl.append(el("div", {className: "kv"},
    el("span", {textContent: catOf(x.category).icon + " " + x.description + " · " + x.date}),
    el("strong", {className: "negative", textContent: "−" + money(x.amount)}))));
}

/* ===== Settings ===== */
function syncSettings() {
  $("sTheme").value = M.settings.theme;
  $("sLang").value = M.settings.lang;
  $("sCur").value = M.settings.currency;
  $("pinStatus").textContent = t(M.settings.pin ? "pinOn" : "pinNone");
}
const hashPin = p => {
  let h = 5381;
  const s = "pl|" + p + "|ledger";
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return "h" + (h >>> 0).toString(36);
};
function lock() {
  $("lock").hidden = false;
  $("pinIn").value = "";
  $("pinErr").textContent = "";
  $("pinIn").focus();
}
function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], {type: mime}));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const rows = [];
  let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

/* ===== Render orchestration ===== */
function refresh() { renderHome(); renderBudget(); renderReports(); }

  applyI18n(); fillFilterCats();
  fillCats($("recCategory"), $("recType").value, $("recCategory").value);
  renderHome(); renderBudget(); renderGoals(); renderPlan(); renderReports(); syncSettings();
}
function showTab(n) {
  document.querySelectorAll(".tab").forEach(s => { s.hidden = s.id !== "tab-" + n; });
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === n));
  if (n === "reports") renderReports();
  window.scrollTo(0, 0);
}
function budgetWarn(cat) {
  const b = M.budgets[cat];
  if (!b) return false;
  const s = spentByCat(today().slice(0, 7))[cat] || 0, p = Math.round(s / b * 100);
  if (s > b) { toast(tf("overBudget", {c: catName(cat)})); return true; }
  if (p >= 80) { toast(tf("nearBudget", {c: catName(cat), p})); return true; }
  return false;
}

/* ===== Events ===== */
document.querySelectorAll("nav button").forEach(b => { b.onclick = () => showTab(b.dataset.tab); });
$("type").onchange = () => fillCats($("category"), $("type").value);
$("recType").onchange = () => fillCats($("recCategory"), $("recType").value);
const formData = () => ({type: $("type").value, description: $("description").value,
  amount: $("amount").value, date: $("date").value, category: $("category").value});

$("form").addEventListener("submit", event => {
  event.preventDefault();
  const ex = editingId && items.find(x => x.id === editingId);
  const x = cleanItem(Object.assign(formData(), {id: ex ? ex.id : uid(), rid: ex && ex.rid}));
  if (!x) { alert(t("invalid")); return; }
  if (ex) Object.assign(ex, x); else items.push(x);
  persist(); resetForm(); refresh();
  const warned = x.type === "expense" && monthOf(x.date) === today().slice(0, 7) && budgetWarn(x.category);
  if (!warned) toast(t(ex ? "updated" : "saved"));
});
$("cancel").onclick = () => { resetForm(); renderList(); };
$("saveTpl").onclick = () => {
  const x = cleanItem(Object.assign(formData(), {id: "x"}));

$("q").oninput = () => { F.q = $("q").value.trim().toLowerCase(); limit = 20; renderList(); };
$("fType").onchange = () => { F.type = $("fType").value; limit = 20; renderList(); };
$("fCat").onchange = () => { F.cat = $("fCat").value; limit = 20; renderList(); };
$("fMonth").onchange = () => { F.month = /^\d{4}-\d{2}$/.test($("fMonth").value) ? $("fMonth").value : ""; limit = 20; renderList(); };
$("clearF").onclick = () => {
  Object.assign(F, {q: "", type: "all", cat: "all", month: ""});

$("goalForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("goalName").value.trim().slice(0, 60);
  const target = Number($("goalTarget").value);
  const deadline = $("goalDeadline").value;
  if (!name || !Number.isFinite(target) || target <= 0 || (deadline && !isDate(deadline))) {
    alert(t("invalid")); return;
  }
  M.goals.push({id: uid(), name, target: round2(target), saved: 0, deadline: deadline || ""});

$("recForm").addEventListener("submit", e => {
  e.preventDefault();
  const x = cleanItem({id: "x", type: $("recType").value, description: $("recDesc").value,
    amount: $("recAmount").value, date: today(), category: $("recCategory").value});
  const day = Math.floor(Number($("recDay").value));
  if (!x || !(day >= 1 && day <= 31)) { alert(t("invalid")); return; }
  const cur = today().slice(0, 7), [y, mo] = cur.split("-").map(Number);
  const eff = Math.min(day, daysIn(y, mo));
  M.recurring.push({id: uid(), type: x.type, description: x.description, amount: x.amount,
    category: x.category, day, last: eff <= Number(today().slice(8)) ? cur : addMonth(cur, -1)});

  fillCats($("recCategory"), $("recType").value);
  renderPlan(); renderUpcoming(); toast(t("recCreated"));

$("export").onclick = () => {
  const q = v => {
    let s = String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  };
  const csv = "﻿Type,Description,Amount,Date,Category\n" +
    items.map(x => [x.type, x.description, x.amount, x.date, x.category].map(q).join(",")).join("\n");
  download("pocket-ledger.csv", csv, "text/csv;charset=utf-8;");
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  if (f.size > 2e6) { toast(t("fileBig")); return; }
  let rows;
  try { rows = parseCSV(await f.text()); } catch { toast(t("importBad")); return; }
  if (!rows.length) { toast(t("importBad")); return; }
  const head = rows[0].map(s => s.trim().toLowerCase());
  let idx = {type: 0, description: 1, amount: 2, date: 3, category: 4};
  if (head.includes("type") && head.includes("amount")) {
    rows.shift();
    idx = {type: head.indexOf("type"), description: head.indexOf("description"),
      amount: head.indexOf("amount"), date: head.indexOf("date"), category: head.indexOf("category")};
  }
  const keyOf = x => [x.type, x.description, x.amount, x.date, x.category].join("|");
  const seen = new Set(items.map(keyOf));
  let n = 0, s = 0;
  rows.forEach(r => {
    const get = i => (i >= 0 && r[i] != null ? r[i] : "");
    const x = cleanItem({id: uid(), type: get(idx.type).trim().toLowerCase(),
      description: get(idx.description).replace(/^'(?=[=+\-@\t\r])/, ""),
      amount: get(idx.amount).replace(/,/g, "").trim(), date: get(idx.date).trim(),
      category: get(idx.category).trim().toLowerCase()});
    if (!x || seen.has(keyOf(x))) { s++; return; }
    seen.add(keyOf(x)); items.push(x); n++;
  });
  persist(); refresh();
  toast(tf("importDone", {n, s}));
};
$("backup").onclick = () => {
  const {theme, lang, currency} = M.settings;
  download("pocket-ledger-backup-" + today() + ".json", JSON.stringify({
    app: "pocket-ledger", version: 2, exported: new Date().toISOString(), items,
    budgets: M.budgets, goals: M.goals, recurring: M.recurring, templates: M.templates,
    settings: {theme, lang, currency}}, null, 2), "application/json");
};
$("restoreBtn").onclick = () => $("restoreFile").click();
$("restoreFile").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  if (f.size > 5e6) { toast(t("fileBig")); return; }
  let raw;
  try { raw = JSON.parse(await f.text()); } catch { toast(t("importBad")); return; }
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.items)) { toast(t("importBad")); return; }
  if (!confirm(t("confirmRestore"))) return;
  const nm = cleanMeta(raw);
  nm.settings.pin = M.settings.pin;
  items = fixIds(raw.items.map(cleanItem).filter(Boolean));
  M = nm;
  applyRecurring();
  persist(); applyTheme(); resetForm(); renderAll();
  toast(t("restored"));
};
$("clearAll").onclick = () => {
  if (!confirm(t("confirmClear")) || !confirm(t("confirmClear2"))) return;
  items = [];
  const s = M.settings;
  M = defMeta(); M.settings = s;
  persist(); resetForm(); renderAll();
  toast(t("cleared"));
};

fillCats($("category"), "expense");
fillCats($("recCategory"), "expense");
renderAll();
if (autoAdded) toast(tf("recAutoAdded", {n: autoAdded}));
if (M.settings.pin) lock();
