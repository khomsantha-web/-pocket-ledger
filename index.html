<!-- Pocket Ledger v1.1 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Ledger</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#f4f6f8;color:#172033;
font:16px Arial,sans-serif}
main{max-width:620px;margin:auto;padding:22px 16px}
h1{margin-bottom:5px}
.muted{color:#64748b;font-size:14px}
.card{background:white;padding:18px;border-radius:16px;
margin:14px 0;box-shadow:0 2px 10px #00000008}
.balance{font-size:30px;font-weight:bold;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount{font-size:20px;font-weight:bold;margin-top:8px}
label{display:block;font-size:14px;margin:12px 0 6px}
input,select,button{width:100%;padding:12px;border-radius:9px;
border:1px solid #cbd5e1;font-size:16px}
button{background:#172033;color:white;border:0;
font-weight:bold;margin-top:14px;cursor:pointer}
button.secondary{background:#e2e8f0;color:#172033}
.entry{padding:12px 0;border-bottom:1px solid #e2e8f0}
.entry strong{display:block;margin-bottom:5px}
.entry small{color:#64748b}
.entry button{width:auto;padding:7px 10px;margin:8px 5px 0 0;
font-size:13px;background:#e2e8f0;color:#172033}
.entry.editing{background:#fffbeb}
.negative{color:#dc2626}.positive{color:#15803d}
.bar{height:10px;border-radius:5px;background:#e2e8f0;
margin-top:12px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:#15803d}
.bar span.warn{background:#f59e0b}
.bar span.over{background:#dc2626}
</style>
</head>
<body>
<main>
<h1>Pocket Ledger</h1>
<p class="muted">Your money, made simple.</p>

<section class="card">
<div class="muted">Current balance (₪)</div>
<div class="balance" id="balance">₪0.00</div>
</section>

<div class="stats">
<section class="card">
<div class="muted">Income</div>
<div class="amount positive" id="income">₪0.00</div>
</section>
<section class="card">
<div class="muted">Expenses</div>
<div class="amount negative" id="expense">₪0.00</div>
</section>
</div>

<section class="card">
<div class="muted">This month</div>
<div class="amount" id="monthNet">₪0.00</div>
<div class="muted" id="monthInfo"></div>
<div class="bar"><span id="barFill"></span></div>
<div class="muted" id="barText"></div>
</section>

<section class="card">
<h2 id="formTitle">Add transaction</h2>
<form id="form">
<label for="type">Transaction type</label>
<select id="type">
<option value="expense">Expense</option>
<option value="income">Income</option>
</select>

<label for="description">Description</label>
<input id="description" placeholder="e.g. Groceries" required>

<label for="amount">Amount (₪)</label>
<input id="amount" type="number" min="0.01"
step="0.01" placeholder="0.00" required>

<label for="date">Date</label>
<input id="date" type="date" required>

<button type="submit" id="submitBtn">Save transaction</button>
<button type="button" id="cancel" class="secondary" hidden>Cancel edit</button>
</form>
</section>

<section class="card">
<h2>Recent transactions</h2>
<div id="list"></div>
<button type="button" id="export">Export CSV</button>
<p class="muted">Data is stored in this browser on this device.</p>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const key = "pocket-ledger-v1";
let items = [];
let editingId = null;
try {
  items = JSON.parse(localStorage.getItem(key) || "[]");
  if (!Array.isArray(items)) items = [];
} catch { items = []; }

const today = () => new Date().toLocaleDateString("en-CA");
$("date").value = today();
const money = n => "₪" + n.toLocaleString("en-IL", {
  minimumFractionDigits: 2, maximumFractionDigits: 2
});
const signed = n => (n < 0 ? "−" : "") + money(Math.abs(n));
const save = () => localStorage.setItem(key, JSON.stringify(items));

function resetForm() {
  editingId = null;
  $("form").reset();
  $("date").value = today();
  $("formTitle").textContent = "Add transaction";
  $("submitBtn").textContent = "Save transaction";
  $("cancel").hidden = true;
}

function renderOverview() {
  const month = today().slice(0, 7);
  const m = items.filter(x => x.date.slice(0, 7) === month);
  const mInc = m.filter(x => x.type === "income")
    .reduce((s,x) => s + x.amount, 0);
  const mExp = m.filter(x => x.type === "expense")
    .reduce((s,x) => s + x.amount, 0);
  const net = mInc - mExp;

  $("monthNet").textContent = signed(net);
  $("monthNet").className = "amount " + (net < 0 ? "negative" : "positive");
  $("monthInfo").textContent = m.length + " transaction" +
    (m.length === 1 ? "" : "s") + " · in " + money(mInc) +
    " · out " + money(mExp);

  const pct = mInc > 0 ? (mExp / mInc) * 100 : (mExp > 0 ? 100 : 0);
  const shown = Math.min(pct, 100);
  $("barFill").style.width = shown + "%";
  $("barFill").className = pct > 100 ? "over" : pct >= 80 ? "warn" : "";
  $("barText").textContent = mInc > 0
    ? "Spent " + Math.round(pct) + "% of this month's income"
    : mExp > 0 ? "Expenses with no income this month"
    : "No activity this month";
}

function render() {
  const income = items.filter(x => x.type === "income")
    .reduce((s,x) => s + x.amount, 0);
  const expense = items.filter(x => x.type === "expense")
    .reduce((s,x) => s + x.amount, 0);

  $("balance").textContent = signed(income - expense);
  $("balance").className = "balance" +
    (income - expense < 0 ? " negative" : "");
  $("income").textContent = money(income);
  $("expense").textContent = money(expense);
  renderOverview();
  $("list").replaceChildren();

  if (!items.length) {
    $("list").textContent = "No transactions yet. Add your first one!";
    return;
  }

  [...items].sort((a,b) => b.date.localeCompare(a.date))
    .forEach(item => {
      const row = document.createElement("div");
      row.className = "entry" + (item.id === editingId ? " editing" : "");
      const title = document.createElement("strong");
      title.textContent = item.description;
      const detail = document.createElement("small");
      detail.textContent = item.date + " · " +
        (item.type === "income" ? "Income" : "Expense");
      const value = document.createElement("div");
      value.className = "amount " +
        (item.type === "income" ? "positive" : "negative");
      value.textContent = (item.type === "income" ? "+" : "−")
        + money(item.amount);

      const edit = document.createElement("button");
      edit.textContent = "Edit";
      edit.type = "button";
      edit.onclick = () => {
        editingId = item.id;
        $("type").value = item.type;
        $("description").value = item.description;
        $("amount").value = item.amount;
        $("date").value = item.date;
        $("formTitle").textContent = "Edit transaction";
        $("submitBtn").textContent = "Update transaction";
        $("cancel").hidden = false;
        $("form").scrollIntoView({behavior: "smooth", block: "start"});
        render();
      };

      const del = document.createElement("button");
      del.textContent = "Delete";
      del.type = "button";
      del.onclick = () => {
        if (!confirm("Delete this transaction?")) return;
        items = items.filter(x => x.id !== item.id);
        if (editingId === item.id) resetForm();
        save(); render();
      };
      row.append(title, detail, value, edit, del);
      $("list").append(row);
    });
}

$("form").addEventListener("submit", event => {
  event.preventDefault();
  const description = $("description").value.trim();
  const amount = Number($("amount").value);
  const date = $("date").value;
  if (!description || !Number.isFinite(amount) ||
      amount <= 0 || !date) {
    alert("Please enter valid transaction details.");
    return;
  }
  const type = $("type").value;
  const existing = editingId && items.find(x => x.id === editingId);
  if (existing) {
    Object.assign(existing, {type, description, amount, date});
  } else {
    items.push({
      id: crypto.randomUUID(),
      type, description, amount, date
    });
  }
  resetForm();
  save(); render();
});

$("cancel").onclick = () => { resetForm(); render(); };

$("export").onclick = () => {
  const q = value => '"' + String(value).replace(/"/g,'""') + '"';
  const csv = "\uFEFFType,Description,Amount,Date\n" +
    items.map(x => [x.type,x.description,x.amount,x.date]
      .map(q).join(",")).join("\n");
  const url = URL.createObjectURL(
    new Blob([csv], {type:"text/csv;charset=utf-8;"})
  );
  const a = document.createElement("a");
  a.href = url;
  a.download = "pocket-ledger.csv";
  a.click();
  URL.revokeObjectURL(url);
};

render();
</script>
</body>
</html>
